<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/registrar_usu.css">
    <title>Registrate Aqui</title>
</head>
<body>
    <form class="login">
        <h3>Crea tu cuenta</h3>
        <div>
            <label for="nom_ape">Nombre y Apellido</label>
            <input type="text" id="nom_ape" class="input_form" placeholder="Adis Ortiz">
        </div>
        <div>
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" class="input_form" placeholder="ejemplo@gmail.com">
        </div>
        <div>
            <label for="password">Contraseña</label>
            <input type="password" id="password" class="input_form" placeholder="">
        </div>
        <div class="boton">
            <input type="submit" class="btn" value="Aceptar">
        </div>
        <p>Al crear una cuenta, usted acepta los Términos de servicio y la Política de privacidad.</p>
        <p class="registro">¿Ya tienes una cuenta? <a href="Login.html" target="">Inicia Sesión Aquí.</a></p>
    </form>
</body>
</html>
