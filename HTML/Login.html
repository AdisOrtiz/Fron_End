<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/Login.css">
    <link rel="shortcut icon" href="/Imagenes/ico.png" type="image/x-icon">
    <title>Inicio de Sesion</title>
</head>
<body>
    <form class="login">
        <h3>Iniciar Sesión</h3>
        <p>Inicie sesión ingresando su dirección de correo electrónico y contraseña.</p>
        <div>
            <label for="user">Correo Electrónico</label>
            <input type="email" id="user" class="input_form" placeholder="ejemplo@gmail.com">
        </div>
        <div>
            <label for="password">Contraseña</label>
            <input type="password" id="password" class="input_form" placeholder="">
        </div>
        <div class="boton">
            <input type="submit" class="btn" value="Aceptar">
        </div>
        <p class="registro">¿No tienes cuenta? <a href="registrar_usu.html" target="">Regístrate Aquí</a></p>
    </form>
</body>
</html>
